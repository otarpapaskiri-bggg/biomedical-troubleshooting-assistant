
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biomedical Diagnostics</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 30px;
  max-width: 800px;
  margin: auto;
}
h1 { color: #38bdf8; }
.card {
  background: #1e293b;
  padding: 22px;
  border-radius: 12px;
  margin-top: 20px;
}
button {
  background: #0284c7;
  color: white;
  border: 0;
  padding: 12px 18px;
  margin: 8px 5px 8px 0;
  border-radius: 7px;
  cursor: pointer;
}
button:hover { background: #0369a1; }
#result {
  color: #7dd3fc;
  line-height: 1.7;
  margin-top: 20px;
}
small { color: #94a3b8; }
</style>
</head>
<body>

<h1>Biomedical Diagnostics</h1>
<p>Medical Equipment Troubleshooting Assistant</p>
<small>Version 1.0 | Educational simulator</small>

<div class="card">
  <h2>Diagnostic Scenario</h2>
  <p>Equipment: Steam Autoclave</p>
  <p>Symptom: Jacket pressure is not increasing.</p>

  <h3>What would you check first?</h3>

  <button onclick="diagnose(1)">Power supply</button>
  <button onclick="diagnose(2)">Heating system</button>
  <button onclick="diagnose(3)">Pressure sensor</button>

  <div id="result"></div>
</div>

<script>
function diagnose(choice) {
  const result = document.getElementById("result");

  if (choice === 1) {
    result.innerHTML =
      "<b>Step 1: Electrical inspection</b><br>" +
      "Check the incoming voltage and power supply.<br>" +
      "Confirm that the control system is powered.<br>" +
      "<br>Next: Check whether the heater receives power.";
  }

  if (choice === 2) {
    result.innerHTML =
      "<b>Step 1: Heating system</b><br>" +
      "Check the heater command, electrical supply and heating status.<br>" +
      "Compare actual temperature with the setpoint.";
  }

  if (choice === 3) {
    result.innerHTML =
      "<b>Step 1: Pressure measurement</b><br>" +
      "Compare the displayed pressure with an independent measurement.<br>" +
      "Inspect sensor wiring and signal connections.";
  }
}
</script>

</body>
</html>
